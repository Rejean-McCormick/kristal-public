name: Kristal Publish — C3 protected (sealed pending C1/C2)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Explicit published Kristal slug (no implicit genesis default)
        type: string
        required: true

# Deliberately read-only. C3 CANNOT publish until trusted C1/C2 receipts
# and verification of their authentic issuer / exact contents are integrated.
permissions:
  contents: read

jobs:
  candidate-preflight:
    name: Read-only candidate preflight — release DISABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Load existing pinned framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rejean-McCormick/KristalV10
          ref: 27c0c7db3d79a4597c1c964fe8281fa35b5f858a
          path: .kristal-framework
          persist-credentials: false
      - name: Strict surface/index checks and selected snapshot verification
        env:
          C3_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python3 tools/c3_collection.py --repo . candidate --slug "$C3_SLUG"
          node .kristal-framework/reference/js/bin/kristal-ref.mjs verify-state-v9 "kristals/$C3_SLUG/state/state-snapshot.json"
      - name: Build and verify candidate bundle locally (no upload)
        env:
          C3_SLUG: ${{ inputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node .kristal-framework/reference/js/bin/kristal-ref.mjs build-publication-bundle-v10 "kristals/$C3_SLUG/state/state-snapshot.json" .kristal/node.json .kristal/bindings/github.json dist/c3-candidate --source-commit "$GITHUB_SHA"
          node .kristal-framework/reference/js/bin/kristal-ref.mjs verify-publication-bundle-v10 dist/c3-candidate
      - name: Publication authorization and independent qualification NOT CONNECTED
        shell: bash
        run: |
          echo 'BLOCKED: C1 independent receipt + C2 trusted initial approval/revocation/scope are not wired.' >&2
          echo 'No GitHub Release operation is included and this workflow has no write permission.' >&2
          exit 1
