name: C3 / C1-C2 Offline Regression Tests (not qualification)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-only:
    name: Offline structural and signed-receipt fixtures — NO publication status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install offline signature verifier dependency (no signing keys)
        run: python -m pip install -r requirements-security.txt
      - name: Run safe fixtures (not the hosted collection)
        run: python -m unittest discover -s tests -v
      - name: Report local repository readiness (does not qualify C1/C2)
        run: python tools/repository_audit.py --repo .
      - name: Clarify scope
        run: |
          echo 'Tests use synthetic signing keys; no real C1/C2 trust roots, publication permission, immutable release or write operations are supplied.'
